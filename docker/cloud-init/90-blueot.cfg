# blue-ot: make cloud-init usable inside the container.
#
# Only the local NoCloud seed (and None) are probed, so boot never stalls on
# cloud datasource discovery (EC2/Azure/GCE/OpenStack/...). Drop a seed at
# /var/lib/cloud/seed/nocloud (baked in, or mounted from the host) to provision
# the container at boot: users, SSH keys, packages, files, commands.
datasource_list: [ NoCloud, None ]

# Docker manages the container network; don't let cloud-init render netplan or
# bounce interfaces out from under it.
network:
  config: disabled

# The hostname comes from the NoCloud seed's local-hostname (which matches the
# compose `hostname:`); leave it alone on later boots.
preserve_hostname: false
